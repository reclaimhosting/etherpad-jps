type: install
id: etherpad
version: '1.0'
appVersion: latest
name: Etherpad
logo: https://raw.githubusercontent.com/reclaimhosting/etherpad-jps/master/images/etherpad-logo.png
homepage: https://etherpad.org/
categories: 
- apps/collaboration
- apps/popular
- apps/e-learning
description: 
  text: Etherpad is a highly customizable Open Source online editor providing collaborative editing in really real-time.

globals:
  shortname: etherpad
  path: /root/etherpad
  repo: https://github.com/etherpad/jps
  adminPass: ${fn.password}
  pgPass: ${fn.password}

nodes:
  nodeType: dockerengine
  nodeGroup: cp
  cloudlets: 32
  fixedcloudlets: 1
  extip: true
  displayName: AppServer
  addons: [change-domain, change-password, update]
  volumes: ["${globals.path}"]

settings:
  domain:
    fields:
      - name: displayfield
        type: displayfield
        hideLabel: true
        markup: |
          The new domain should already have an A record pointed at this environment's IP address.
      - name: domain
        hideLabel: true
        caption: Domain
        type: string
        vtype: extdomain

onInstall:
  - setup

actions:
  setup:      
    - cmd[cp]: |-
        mkdir -p ${globals.path}
        cd ${globals.path}
        git clone ${globals.repo} --depth 1 .
        rm -rf .git
        rm manifest.yaml
        sed -i \
        -e "s|DOMAIN=.*|DOMAIN=${env.domain}|" \
        -e "s|EMAIL=.*|EMAIL=${user.email}|" \
        -e "s|ADMIN_PASSWORD=.*|ADMIN_PASSWORD=${global.adminPass}|" \
        -e "s|DB_PASS=.*|DB_PASS=${global.pgPass}|" \
        .env
        docker-compose up -d
    - env.file.AddFavorite:
        nodeGroup: cp
        path: ${globals.path}
        keyword: ${globals.shortname}

addons:
  - id: change-domain
    name: Domain Configuration
    description: Change domain name and issue Let's Encrypt certificates.
    permanent: true
    buttons:
      - confirmText: Are you sure you want to proceed?
        loadingText: Changing domain...
        action: changeDomain
        caption: Change
        successText: The domain has been updated successfully!
        settings: domain
        title: Please specify the new domain name

    actions:
      changeDomain:
        - cmd[cp]: |-
            cd ${globals.path}
            sed -i \
            -e "s|DOMAIN=.*|DOMAIN=${settings.domain}|" \
            .env
            docker-compose up -d --force-recreate

  - id: change-password
    name: Change Password
    description: Change the admin password for Etherpad.
    permanent: true
    buttons:
      - confirmText: Are you sure you want to proceed?
        loadingText: Changing password...
        action: changePassword
        caption: Change
        successText: The admin password has been updated successfully!
        settings: adminPass
        title: Please specify the new password

    actions:
      changePassword:
        - cmd[cp]: |-
            cd ${globals.path}
            sed -i \
            -e "s|ADMIN_PASS=.*|ADMIN_PASS=${settings.adminPass}|" \
            .env
            docker-compose up -d --force-recreate

  - id: update
    name: Update
    description: Pull the latest version of docker containers
    permanent: true
    buttons:
      - confirmText: Are you sure you want to proceed?
        loadingText: Updating...
        action: pullContainers
        caption: Update
        successText: Your environment has been updated!
        title: Update
    actions:
      pullContainers:
        -  cmd[cp]: |-
            cd ${globals.path}
            docker-compose pull
            docker-compose down
            docker-compose up -d --force-recreate
success: | 
  **${env.displayName}**: [https://${env.domain}/](https://${env.domain}/)
  **Admin Password**: `${global.adminPass}`
  - Admin password can be changed using the **Change Password** add-on or by editing the `.env` file and restarting the containers.
  - Further etherpad configuration can be done by editing the `.env` file and restarting the containers.
  - If you want to map a custom domain, point an A record at **${nodes.cp.extIPs}** then use the **Domain Configuration** Add-On to change the domain name and issue a new Let's Encrypt cert.
  - Use the **Update** add-on to upgrade to the lastest version of the application.
