services:
  caddy:
    image: caddy:2-alpine
    restart: always
    depends_on:
      - etherpad
    environment:
      DOMAIN: ${DOMAIN}
      EMAIL: ${EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy

  etherpad:
    image: etherpad/etherpad:latest
    env_file: ".env"
    user: "5001:0"
    tty: true
    stdin_open: true
    restart: always
    depends_on:
      - postgres
    environment:
      NODE_ENV: production
      DB_CHARSET: "utf8mb4"
      DB_HOST: postgres
      DB_TYPE: postgres
    volumes:
      - ./etherpad-plugins:/opt/etherpad-lite/src/plugin_packages
      - ./etherpad-var:/opt/etherpad-lite/var
    networks:
      - proxy
      - database

  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: $DB_PASS
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./db:/var/lib/postgresql/data
    networks:
      - database

networks:
  proxy:
  database:
    internal: true

volumes:
  caddy_data:
  caddy_config:
